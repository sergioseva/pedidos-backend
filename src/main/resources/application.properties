## App Properties
app.jwtSecret= JWTSuperSecretKeyThatIsLongEnoughForHmacSHA256Algorithm1234567890
app.jwtExpirationInMs = 604800000


endpoints.beans.sensitive=false

#para actuator
management.endpoints.web.exposure.include=*

# La version que muestra /actuator/info. INFO_APP_VERSION la define el Dockerfile a partir del
# build-arg que pasa el workflow de release; fuera de la imagen queda en 'dev'.
info.app.name=Pedidos Backend
info.app.version=${INFO_APP_VERSION:dev}

# Sin esto /actuator/info devuelve {}: desde Spring Boot 2.6 el contribuidor que publica las
# propiedades info.* viene apagado por defecto, asi que las de arriba se definian y no salian.
management.info.env.enabled=true

#para que srping batch cree las tablas solo
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# Flyway: baseline existing database so V1+ migrations run on already-created schemas
spring.flyway.baseline-on-migrate=true

pedidos.luongo.path=/aplicaciones/pedidos/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Sentry — DSN supplied via SENTRY_DSN env var; empty disables the SDK (safe for tests / unconfigured envs)
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:production}
sentry.release=${INFO_APP_VERSION:dev}
# Add data like request headers and IP for users,
# see https://docs.sentry.io/platforms/java/guides/spring-boot/data-management/data-collected/ for more info
sentry.send-default-pii=true
sentry.traces-sample-rate=0
sentry.exception-resolver-order=-2147483647