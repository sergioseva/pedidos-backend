<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css" integrity="sha384-GJzZqFGwb1QTTN6wy59ffF1BuGJpLSa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS" crossorigin="anonymous">

	<title>Lista de Clientes</title>
</head>

<body>

<div class="container">

	<h3>Clientes</h3>
	<hr>
	
	<!-- Add a search form -->

	<form action="#" th:action="@{/clientes/search}"
		  method="GET" class="form-inline">	

		<!-- Add a button -->
		<a th:href="@{/clientes/showFormForAdd}"
			class="btn btn-primary btn-sm mb-3">
			Agregar
		</a>
	
		<input type="search"
			   name=nombre
			   placeholder="Nombre"
			   class="form-control-sm ml-5 mr-2 mb-3" />

		<input type="search"
			   name="telefono"
			   placeholder="Telefono"
			   class="form-control-sm ml-5 mr-2 mb-3" />

		<button type="submit"
				class="btn btn-success btn-sm mb-3">Buscar</button>
							   
	</form>
	
	<table class="table table-bordered table-striped">
		<thead class="thead-dark">
			<tr>
				<th>Nombre</th>
				<th>Telefono Movil</th>
				<th>Telefono Fijo</th>
				<th>Email</th>
			</tr>
		</thead>
		
		<tbody>
			<tr th:each="tempCliente : ${clientes}">
			
				<td th:text="${tempCliente.nombre}" />	
				<td th:text="${tempCliente.telefonoMovil}" />	
				<td th:text="${tempCliente.telefonoFijo}" />	
				<td th:text="${tempCliente.email}" />	
				
				<td>
					<!-- Add "update" button/link -->
					<a th:href="@{/clientes/showFormForUpdate(clienteId=${tempCliente.id})}"
					   class="btn btn-info btn-sm">
						Update
					</a>
					
					<!-- Add "delete" button/link -->					
					<a th:href="@{/clientes/delete(clienteId=${tempCliente.id})}"
					   class="btn btn-danger btn-sm"
					   onclick="if (!(confirm('Are you sure you want to delete this employee?'))) return false">
						Delete
					</a>
					
				</td>
				
				
			</tr>
		</tbody>		
	</table>
	
</div>
	
</body>
</html>
