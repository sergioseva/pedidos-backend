spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:db;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.jpa.show-sql=true
#puedo acceder a los datos entrando por la consola
#http://localhost:8080/h2-console
#y el nombre de la database es jdbc:h2:mem:testdb
spring.h2.console.enabled=true


## App Properties
app.jwtSecret= JWTSuperSecretOtraKey
app.jwtExpirationInMs = 604800000

#para que srping batch cree las tablas solo
spring.batch.initialize-schema=ALWAYS
spring.batch.job.enabled=false

# Flyway disabled for tests: H2 schema is created by Hibernate
spring.flyway.enabled=false

pedidos.luongo.path=/aplicaciones/pedidos/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
